server:
  port: 8084

spring:
  application:
    name: ai-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${DB_DIR:./data}/aidb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 15000

services:
  content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8082}

ai:
  provider: ${AI_PROVIDER:deepseek}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
  count-limit: 5
  temperature: 0.8
  max-days: ${AI_MAX_DAYS:7}
  plan-fallback-enabled: ${AI_PLAN_FALLBACK:true}
  guest-daily-limit: ${AI_GUEST_DAILY_LIMIT:3}
  user-daily-limit: ${AI_USER_DAILY_LIMIT:10}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

security:
  jwt:
    secret: ${JWT_SECRET:laycoo-tourism-local-secret-key-please-change-in-production}
    expire-hours: 168

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.laycoo.tourism: info
